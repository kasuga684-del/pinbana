<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEB予約フォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 右端フェード（スクロール可能であることを示す影） */
    .scroll-container-wrapper {
      position: relative;
    }
    .scroll-container-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 28px;
      background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.95));
      pointer-events: none;
      border-radius: 0 1rem 1rem 0;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-40">

  <header class="sticky top-0 bg-white/90 backdrop-blur border-b border-slate-200 p-4 text-center z-20 shadow-sm">
    <h1 class="text-lg font-black tracking-wider text-pink-600">WEB RESERVATION</h1>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- STEP 1: 日にち選択 -->
    <section>
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-bold text-slate-500 block">1. 📅 予約希望日を選択</label>
        <span class="text-[10px] text-pink-500 font-bold">横スクロール ➔</span>
      </div>
      <div class="scroll-container-wrapper">
        <div id="dateContainer" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar pr-6"></div>
      </div>
    </section>

    <!-- STEP 2: キャスト ＆ 時間選択 -->
    <section class="space-y-4">
      <h2 id="selectedDateTitle" class="text-xs font-bold border-l-4 border-pink-500 pl-2 text-pink-600">
        2. 👤 キャスト ＆ ご案内時間を選択
      </h2>
      <div id="castListContainer" class="space-y-4">
        <p class="text-xs text-slate-400 italic">データを読み込み中...</p>
      </div>
    </section>

    <!-- STEP 3: コース ＆ キャストとのお遊び（指名選択） -->
    <section id="courseSection" class="space-y-4 hidden border-t border-slate-200 pt-5">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-slate-500">3. ⏱ コース選択</label>
        <span id="rookieBadge" class="text-[10px] bg-pink-50 text-pink-600 px-2 py-0.5 rounded border border-pink-200 font-bold hidden">🎉 新人割引適応中</span>
      </div>

      <!-- コース一覧 -->
      <div id="courseContainer" class="grid grid-cols-2 gap-2"></div>

      <!-- キャストとのお遊び（本指名選択） -->
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
        <label id="castPlayTitle" class="text-xs text-slate-700 font-bold block">〇〇とのお遊び <span class="text-pink-500">*</span></label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setNomination(false)" id="nomFirstBtn" class="p-2.5 rounded-xl border text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600">
            初めて
          </button>
          <button type="button" onclick="setNomination(true)" id="nomRepeatBtn" class="p-2.5 rounded-xl border text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600">
            2回目以降
          </button>
        </div>
      </div>
    </section>

    <!-- STEP 4: お客様情報入力 -->
    <section id="userInfoSection" class="space-y-4 hidden border-t border-slate-200 pt-5">
      <label class="text-xs font-bold text-slate-500 block">4. 📝 お客様情報の入力</label>
      
      <!-- 当店のご利用歴 -->
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
        <label class="text-xs text-slate-700 font-bold block">当店のご利用歴 <span class="text-pink-500">*</span></label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setFirstVisit(true)" id="visitFirstBtn" class="p-2.5 rounded-xl border text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600">
            初めて
          </button>
          <button type="button" onclick="setFirstVisit(false)" id="visitRepeatBtn" class="p-2.5 rounded-xl border text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600">
            2回目以降
          </button>
        </div>
      </div>

      <!-- お名前 ＆ 電話番号 -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <div>
          <label class="text-xs text-slate-500 block mb-1">お名前 (偽名でも可) <span class="text-pink-500">*</span></label>
          <input type="text" id="custName" oninput="updateCalculation()" placeholder="お名前を入力してください" class="w-full bg-slate-50 text-slate-800 p-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:bg-white focus:border-pink-500 transition-all">
        </div>
        <div>
          <label class="text-xs text-slate-500 block mb-1">お電話番号 <span class="text-pink-500">*</span></label>
          <input type="tel" id="custPhone" oninput="updateCalculation()" placeholder="例: 09012345678" class="w-full bg-slate-50 text-slate-800 p-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:bg-white focus:border-pink-500 transition-all">
        </div>
      </div>
    </section>

    <!-- STEP 5: 概算料金計算 -->
    <section id="priceBreakdownSection" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2 text-xs hidden">
      <h3 class="font-bold text-slate-700 border-b border-slate-100 pb-2">🧾 お支払総額（概算内訳）</h3>
      <div class="space-y-1.5 text-slate-500">
        <div class="flex justify-between"><span>コース料金:</span><span id="pCourse">¥0</span></div>
        <div class="flex justify-between"><span>本指名料:</span><span id="pNomination">¥0</span></div>
        <div class="flex justify-between"><span>入会金:</span><span id="pAdmission">¥0</span></div>
      </div>
      <div class="border-t border-slate-100 pt-2 flex justify-between font-bold text-base text-pink-600">
        <span>概算合計金額:</span>
        <span id="pTotal">¥0</span>
      </div>
      <p class="text-right text-[11px] text-slate-400 font-bold mt-1">※別途ホテル代</p>
    </section>

  </main>

  <!-- フッターバー -->
  <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 border-t border-slate-200 p-4 backdrop-blur-md z-30 space-y-2 shadow-lg">
    <div class="flex justify-between items-center text-xs">
      <span class="text-slate-400">選択状況:</span>
      <span id="selectedInfoText" class="font-bold text-pink-600">未選択</span>
    </div>
    <button id="nextBtn" disabled onclick="submitReservation()" class="w-full bg-pink-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold py-3.5 rounded-xl shadow-md transition-all">
      予約フォームを送信 (LINEヘ) ➔
    </button>
  </div>

  <script>
    const LIFF_ID = '2010290704-NS1l65Na';

    const TIME_ORDER = [
      '10:00','10:30','11:00','11:30',
      '12:00','12:30','13:00','13:30',
      '14:00','14:30','15:00','15:30',
      '16:00','16:30','17:00','17:30',
      '18:00','18:30','19:00','19:30',
      '20:00','20:30','21:00','21:30',
      '22:00','22:30','23:00'
    ];

    let scheduleData = null;
    let selectedDate = '';
    let selectedCast = null;
    let selectedTime = '';
    let selectedCourse = null;
    let isNominationRepeat = null;
    let isFirstVisit = null;

    const today = new Date();

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (err) {
        console.error('LIFF Init Error:', err);
      }
      initDateTabs();
      loadData();
    });

    function initDateTabs() {
      const container = document.getElementById('dateContainer');
      container.innerHTML = '';

      for (let i = 0; i < 30; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day}`;

        const dayName = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
        const displayStr = `${d.getMonth() + 1}/${d.getDate()}(${dayName})`;

        if (!selectedDate && i === 0) selectedDate = dateStr;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `flex-none px-3.5 py-2.5 rounded-xl text-xs font-bold border transition-all ${
          selectedDate === dateStr ? 'bg-pink-600 text-white border-pink-500 shadow-md' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
        }`;
        btn.innerText = displayStr;
        btn.onclick = () => {
          selectedDate = dateStr;
          selectedCast = null;
          selectedTime = '';
          selectedCourse = null;
          isNominationRepeat = null;
          isFirstVisit = null;
          resetOptionButtons();
          document.getElementById('courseSection').classList.add('hidden');
          document.getElementById('userInfoSection').classList.add('hidden');
          document.getElementById('priceBreakdownSection').classList.add('hidden');
          initDateTabs();
          renderCastList();
          updateFooter();
        };
        container.appendChild(btn);
      }
    }

    async function loadData() {
      try {
        const res = await fetch(`https://api.github.com/repos/kasuga684-del/pinbana/contents/schedule.json?ref=main&t=${Date.now()}`, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.ok) {
          const json = await res.json();
          const binary = atob(json.content.replace(/\s/g, ''));
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          scheduleData = JSON.parse(new TextDecoder().decode(bytes));
          renderCastList();
          return;
        }
      } catch (err) {}

      try {
        const res = await fetch('./schedule.json?t=' + Date.now());
        scheduleData = await res.json();
        renderCastList();
      } catch (err) {}
    }

    function renderCastList() {
      if (!scheduleData) return;
      document.getElementById('selectedDateTitle').innerText = `2. 👤 ${selectedDate} のキャスト ＆ 時間を選択`;

      const container = document.getElementById('castListContainer');
      container.innerHTML = '';

      const daySchedules = scheduleData.schedules[selectedDate] || {};

      const activeCasts = scheduleData.casts.filter(cast => {
        const slots = daySchedules[cast.id] || {};
        return Object.keys(slots).length > 0;
      });

      if (activeCasts.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 italic bg-white p-4 rounded-xl border border-slate-200 text-center">本日出勤のキャストはございません</p>';
        return;
      }

      activeCasts.forEach(cast => {
        const slots = daySchedules[cast.id] || {};
        
        const timeKeys = Object.keys(slots).sort((a, b) => {
          const idxA = TIME_ORDER.indexOf(a);
          const idxB = TIME_ORDER.indexOf(b);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          return a.localeCompare(b);
        });

        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2';

        let slotsHtml = '';
        timeKeys.forEach(time => {
          const status = slots[time];
          const isSelected = selectedCast?.id === cast.id && selectedTime === time;
          const isNG = status === 'ng';

          slotsHtml += `
            <button ${isNG ? 'disabled' : ''} onclick="selectSlot('${cast.id}', '${time}')" class="flex-none px-3.5 py-2.5 rounded-xl text-xs font-bold border transition-all ${
              isNG ? 'bg-slate-100 text-slate-300 border-transparent cursor-not-allowed' : isSelected ? 'bg-pink-600 text-white border-pink-500 scale-105 shadow-md' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200'
            }">
              ${status === 'ok' ? '〇 ' : '× '} ${time}
            </button>
          `;
        });

        card.innerHTML = `
          <div class="flex gap-3 items-center">
            <img src="${cast.photo}" class="w-16 h-16 object-cover rounded-xl bg-slate-100 border border-slate-100" />
            <div>
              <div class="flex items-center gap-1.5">
                <h3 class="font-bold text-base text-slate-800">${cast.name} <span class="text-xs text-slate-400">(${cast.age})</span></h3>
                ${cast.isRookie ? '<span class="text-[9px] bg-pink-50 text-pink-600 px-1.5 py-0.5 rounded border border-pink-200 font-bold">新人</span>' : ''}
              </div>
              <p class="text-xs text-slate-500 mt-0.5">T${cast.height} / B${cast.bust}(${cast.cup}) / W${cast.waist} / H${cast.hip}</p>
            </div>
          </div>
          <div class="pt-2 border-t border-slate-100">
            <div class="flex justify-between items-center text-[11px] text-slate-400 mb-1.5 px-0.5">
              <span>ご案内時間を選択:</span>
              <span class="text-pink-500 font-bold text-[10px]">横スクロール ➔</span>
            </div>
            <div class="scroll-container-wrapper">
              <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar pr-6">
                ${slotsHtml}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectSlot(castId, time) {
      selectedCast = scheduleData.casts.find(c => c.id === castId);
      selectedTime = time;
      selectedCourse = null;
      isNominationRepeat = null;
      isFirstVisit = null;
      resetOptionButtons();

      document.getElementById('castPlayTitle').innerText = `${selectedCast.name}とのお遊び *`;

      const courseSec = document.getElementById('courseSection');
      courseSec.classList.remove('hidden');
      document.getElementById('userInfoSection').classList.remove('hidden');

      renderCourses();
      renderCastList();
      updateCalculation();

      setTimeout(() => {
        const yOffset = -80;
        const y = courseSec.getBoundingClientRect().top + window.pageYOffset + yOffset;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }, 100);
    }

    function resetOptionButtons() {
      document.getElementById('nomFirstBtn').className = 'p-2.5 rounded-xl border text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600';
      document.getElementById('nomRepeatBtn').className = 'p-2.5 rounded-xl border text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600';
      document.getElementById('visitFirstBtn').className = 'p-2.5 rounded-xl border text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600';
      document.getElementById('visitRepeatBtn').className = 'p-2.5 rounded-xl border text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600';
    }

    function renderCourses() {
      const container = document.getElementById('courseContainer');
      const rookieBadge = document.getElementById('rookieBadge');
      container.innerHTML = '';

      if (selectedCast.isRookie) {
        rookieBadge.classList.remove('hidden');
      } else {
        rookieBadge.classList.add('hidden');
      }

      const sortedCourses = [...scheduleData.courses].sort((a, b) => a.minutes - b.minutes);

      sortedCourses.forEach(c => {
        const price = selectedCast.isRookie ? c.priceRookie : c.priceNormal;
        const isSelected = selectedCourse?.id === c.id;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => { selectedCourse = c; renderCourses(); updateCalculation(); };
        btn.className = `p-3 rounded-xl border text-left font-bold transition-all ${
          isSelected ? 'border-pink-500 bg-pink-50 text-pink-600 shadow-sm' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'
        }`;
        btn.innerHTML = `
          <div class="text-xs text-pink-600">${c.minutes}分コース</div>
          <div class="text-sm mt-0.5 font-bold">¥${price.toLocaleString()}</div>
        `;
        container.appendChild(btn);
      });
    }

    function setNomination(isRepeat) {
      isNominationRepeat = isRepeat;
      document.getElementById('nomFirstBtn').className = `p-2.5 rounded-xl border text-xs font-bold text-center ${!isRepeat ? 'border-pink-500 bg-pink-50 text-pink-600 shadow-sm' : 'border-slate-200 bg-slate-50 text-slate-600'}`;
      document.getElementById('nomRepeatBtn').className = `p-2.5 rounded-xl border text-xs font-bold text-center ${isRepeat ? 'border-pink-500 bg-pink-50 text-pink-600 shadow-sm' : 'border-slate-200 bg-slate-50 text-slate-600'}`;
      updateCalculation();
    }

    function setFirstVisit(val) {
      isFirstVisit = val;
      document.getElementById('visitFirstBtn').className = `p-2.5 rounded-xl border text-xs font-bold text-center ${val ? 'border-pink-500 bg-pink-50 text-pink-600 shadow-sm' : 'border-slate-200 bg-slate-50 text-slate-600'}`;
      document.getElementById('visitRepeatBtn').className = `p-2.5 rounded-xl border text-xs font-bold text-center ${!val ? 'border-pink-500 bg-pink-50 text-pink-600 shadow-sm' : 'border-slate-200 bg-slate-50 text-slate-600'}`;
      updateCalculation();
    }

    function updateCalculation() {
      if (!selectedCast || !selectedCourse) {
        document.getElementById('priceBreakdownSection').classList.add('hidden');
        updateFooter();
        return;
      }

      document.getElementById('priceBreakdownSection').classList.remove('hidden');

      const coursePrice = selectedCast.isRookie ? selectedCourse.priceRookie : selectedCourse.priceNormal;
      const nominationFee = isNominationRepeat === true ? 1000 : 0;
      const admissionFee = isFirstVisit === true ? 1000 : 0;

      const total = coursePrice + nominationFee + admissionFee;

      document.getElementById('pCourse').innerText = `¥${coursePrice.toLocaleString()}`;
      document.getElementById('pNomination').innerText = isNominationRepeat === null ? '未選択' : `¥${nominationFee.toLocaleString()}`;
      document.getElementById('pAdmission').innerText = isFirstVisit === null ? '未選択' : `¥${admissionFee.toLocaleString()}`;
      document.getElementById('pTotal').innerText = `¥${total.toLocaleString()}`;

      updateFooter();
    }

    function updateFooter() {
      const btn = document.getElementById('nextBtn');
      const text = document.getElementById('selectedInfoText');

      const name = document.getElementById('custName')?.value.trim();
      const phone = document.getElementById('custPhone')?.value.trim();

      if (!selectedCast || !selectedTime) {
        text.innerText = '未選択';
        btn.disabled = true;
      } else if (!selectedCourse) {
        text.innerText = `${selectedCast.name} ${selectedTime}~ (コース未選択)`;
        btn.disabled = true;
      } else if (isNominationRepeat === null) {
        text.innerText = `「${selectedCast.name}とのお遊び」を選択してください`;
        btn.disabled = true;
      } else if (isFirstVisit === null) {
        text.innerText = `「当店のご利用歴」を選択してください`;
        btn.disabled = true;
      } else if (!name || !phone) {
        text.innerText = `お名前・電話番号を入力してください`;
        btn.disabled = true;
      } else {
        text.innerText = `${selectedDate} ${selectedTime}~ / ${selectedCast.name} (${selectedCourse.minutes}分コース)`;
        btn.disabled = false;
      }
    }

    async function submitReservation() {
      const btn = document.getElementById('nextBtn');
      btn.disabled = true;
      btn.innerText = '送信中...';

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();

      const coursePrice = selectedCast.isRookie ? selectedCourse.priceRookie : selectedCourse.priceNormal;
      const nominationFee = isNominationRepeat === true ? 1000 : 0;
      const admissionFee = isFirstVisit === true ? 1000 : 0;
      const total = coursePrice + nominationFee + admissionFee;

      const messageText = 
`WEB予約フォーム 
送信ありがとうございます！

お名前：${name}
お電話番号：${phone}
当店ご利用歴：${isFirstVisit ? '初めて' : '2回目以降'}

ご希望日時：${selectedDate} ${selectedTime}〜
指名キャスト：${selectedCast.name} (${isNominationRepeat ? '指名2回目以降' : '指名初めて'})
選択コース：${selectedCourse.minutes}分コース

【お支払概算合計】
¥${total.toLocaleString()}
※別途ホテル代がかかります

上記の内容で予約のご希望を受け付けました

※まだ予約は確定しておりません※

ワンオペ店長が空き状況を確認の上、
折り返し「予約確定メッセージ」をお送りいたします✨

混雑状況によりご希望に添えない場合もございますので、
ワンオペ店長からの返信を今しばらくお待ちくださいませ🙇‍♂️`;

      if (liff.isInClient()) {
        try {
          await liff.sendMessages([{ type: 'text', text: messageText }]);
          liff.closeWindow();
        } catch (err) {
          alert('送信エラー: ' + err.message);
          btn.disabled = false;
          btn.innerText = '予約フォームを送信 (LINEヘ) ➔';
        }
      } else {
        alert('【テスト表示】LINE内では以下の文章が自動送信されます:\n\n' + messageText);
        btn.disabled = false;
        btn.innerText = '予約フォームを送信 (LINEヘ) ➔';
      }
    }
  </script>
</body>
</html>
