<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗統合管理ダッシュボード (PC専用)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div class="flex h-screen overflow-hidden">

    <!-- サイドバー (ナビゲーション) -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-6">
      <div class="space-y-8">
        <div>
          <span class="text-xs font-black text-pink-500 tracking-widest uppercase block">Store System</span>
          <h1 class="text-lg font-extrabold text-white">店舗管理パネル</h1>
        </div>

        <!-- タブ切替メニュー -->
        <nav class="space-y-2">
          <button onclick="switchTab('casts')" id="tabBtn-casts" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold bg-pink-600 text-white transition-all">
            👤 キャスト情報管理
          </button>
          <button onclick="switchTab('courses')" id="tabBtn-courses" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold bg-slate-800 text-slate-400 hover:text-slate-200 transition-all">
            💰 料金・コース設定
          </button>
          <button onclick="switchTab('schedules')" id="tabBtn-schedules" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold bg-slate-800 text-slate-400 hover:text-slate-200 transition-all">
            📅 出勤・予約枠コントロール
          </button>
        </nav>
      </div>

      <div class="pt-4 border-t border-slate-800">
        <button onclick="saveTokenPrompt()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2.5 rounded-lg border border-slate-700 font-bold transition-all">
          🔑 GitHubトークン再設定
        </button>
      </div>
    </aside>

    <!-- メインコンテンツ領域 -->
    <main class="flex-1 overflow-y-auto p-8 space-y-6">

      <!-- ================= 項目 1: キャスト情報管理 ================= -->
      <section id="section-casts" class="tab-content space-y-6">
        <div class="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <div>
            <h2 class="text-xl font-bold text-white">👤 キャスト情報</h2>
            <p class="text-xs text-slate-400 mt-1">店舗に所属するキャストのプロフィール・写真・指名料を管理します</p>
          </div>
          <div class="flex gap-3">
            <button onclick="addNewCast()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-700">
              ＋ 新規キャスト追加
            </button>
            <button onclick="saveData('casts')" class="bg-pink-600 hover:bg-pink-500 text-white text-sm font-bold px-6 py-2.5 rounded-xl shadow-lg transition-all">
              💾 キャスト情報を更新
            </button>
          </div>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-950 text-slate-400 text-xs border-b border-slate-800">
                <th class="p-4">写真</th>
                <th class="p-4">名前</th>
                <th class="p-4">年齢</th>
                <th class="p-4">キャッチコピー / タグ</th>
                <th class="p-4">本指名料 (円)</th>
                <th class="p-4">画像URL</th>
                <th class="p-4 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="castTableBody" class="divide-y divide-slate-800/60 text-sm">
              <!-- JSでテーブル行を生成 -->
            </tbody>
          </table>
        </div>
      </section>


      <!-- ================= 項目 2: 料金・コース設定 ================= -->
      <section id="section-courses" class="tab-content space-y-6 hidden">
        <div class="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <div>
            <h2 class="text-xl font-bold text-white">💰 料金・コース設定</h2>
            <p class="text-xs text-slate-400 mt-1">予約フォームで選択できるコース時間と料金を設定します</p>
          </div>
          <div class="flex gap-3">
            <button onclick="addNewCourse()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-700">
              ＋ コース追加
            </button>
            <button onclick="saveData('courses')" class="bg-pink-600 hover:bg-pink-500 text-white text-sm font-bold px-6 py-2.5 rounded-xl shadow-lg transition-all">
              💾 料金設定を更新
            </button>
          </div>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-950 text-slate-400 text-xs border-b border-slate-800">
                <th class="p-4">コース名</th>
                <th class="p-4">時間 (分)</th>
                <th class="p-4">料金 (円)</th>
                <th class="p-4 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="courseTableBody" class="divide-y divide-slate-800/60 text-sm">
              <!-- JSでテーブル行を生成 -->
            </tbody>
          </table>
        </div>
      </section>


      <!-- ================= 項目 3: 出勤・予約枠コントロール ================= -->
      <section id="section-schedules" class="tab-content space-y-6 hidden">
        <div class="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800">
          <div>
            <h2 class="text-xl font-bold text-white">📅 出勤・予約枠コントロール</h2>
            <p class="text-xs text-slate-400 mt-1">指定日のキャスト別出勤時間・30分刻みの〇/×枠を管理します</p>
          </div>
          <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
              <label class="text-xs text-slate-400 font-bold">日付:</label>
              <input type="date" id="datePicker" onchange="renderSchedules()" class="bg-transparent text-white font-bold text-sm outline-none">
            </div>
            <button onclick="saveData('schedules')" class="bg-pink-600 hover:bg-pink-500 text-white text-sm font-bold px-6 py-2.5 rounded-xl shadow-lg transition-all">
              💾 出勤情報を更新
            </button>
          </div>
        </div>

        <div id="scheduleContainer" class="space-y-6">
          <!-- JSでキャストごとの出勤・〇×コマを一覧生成 -->
        </div>
      </section>

    </main>
  </div>

  <script>
    const OWNER = 'kasuga684-del';
    const REPO = 'pinbana';
    const FILE_PATH = 'schedule.json';

    let scheduleData = null;
    let fileSha = '';

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('datePicker').value = todayStr;

    function getToken() {
      let token = localStorage.getItem('github_pat');
      if (!token) {
        token = prompt('GitHub トークン（ghp_...）を入力してください:');
        if (token) localStorage.setItem('github_pat', token.trim());
      }
      return token;
    }

    function saveTokenPrompt() {
      const token = prompt('新しい GitHub トークン（ghp_...）を入力してください:');
      if (token) {
        localStorage.setItem('github_pat', token.trim());
        alert('トークンを保存しました！');
        loadData();
      }
    }

    // タブ切替処理
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('bg-pink-600', 'text-white');
        el.classList.add('bg-slate-800', 'text-slate-400');
      });

      document.getElementById(`section-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tabBtn-${tabName}`);
      activeBtn.classList.add('bg-pink-600', 'text-white');
      activeBtn.classList.remove('bg-slate-800', 'text-slate-400');
    }

    // GitHubから全データ読み込み
    async function loadData() {
      const token = getToken();
      if (!token) return;

      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `token ${token}` },
          cache: 'no-store'
        });

        if (!res.ok) throw new Error('取得失敗');

        const json = await res.json();
        fileSha = json.sha;

        const content = decodeURIComponent(escape(atob(json.content)));
        scheduleData = JSON.parse(content);

        // 初期データの補填
        if (!scheduleData.courses) {
          scheduleData.courses = [
            { id: "c60", name: "60分コース", minutes: 60, price: 20000 },
            { id: "c90", name: "90分コース", minutes: 90, price: 28000 }
          ];
        }

        renderCasts();
        renderCourses();
        renderSchedules();
      } catch (err) {
        alert('データの取得に失敗しました。トークンを確認してください。');
      }
    }

    /* --- 1. キャスト情報描画 --- */
    function renderCasts() {
      const tbody = document.getElementById('castTableBody');
      tbody.innerHTML = '';

      scheduleData.casts.forEach((cast, idx) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition-all';
        tr.innerHTML = `
          <td class="p-4"><img src="${cast.photo}" class="w-10 h-10 object-cover rounded-lg bg-slate-800 border border-slate-700"></td>
          <td class="p-4"><input type="text" value="${cast.name}" onchange="scheduleData.casts[${idx}].name = this.value" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg border border-slate-800 w-32"></td>
          <td class="p-4"><input type="number" value="${cast.age}" onchange="scheduleData.casts[${idx}].age = Number(this.value)" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg border border-slate-800 w-16"></td>
          <td class="p-4"><input type="text" value="${cast.tag}" onchange="scheduleData.casts[${idx}].tag = this.value" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg border border-slate-800 w-48"></td>
          <td class="p-4"><input type="number" value="${cast.nominationFee}" onchange="scheduleData.casts[${idx}].nominationFee = Number(this.value)" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg border border-slate-800 w-28"></td>
          <td class="p-4"><input type="text" value="${cast.photo}" onchange="scheduleData.casts[${idx}].photo = this.value" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg border border-slate-800 w-64 text-xs"></td>
          <td class="p-4 text-right"><button onclick="deleteCast(${idx})" class="text-xs text-rose-400 hover:text-rose-300 font-bold px-3 py-1 bg-rose-950/40 border border-rose-800 rounded-lg">削除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addNewCast() {
      const newId = 'cast_' + String(scheduleData.casts.length + 1).padStart(2, '0');
      scheduleData.casts.push({
        id: newId,
        name: '新規キャスト',
        age: 20,
        tag: '新人',
        photo: 'https://via.placeholder.com/150',
        nominationFee: 3000
      });
      renderCasts();
    }

    function deleteCast(idx) {
      if (confirm('このキャストを削除してもよろしいですか？')) {
        scheduleData.casts.splice(idx, 1);
        renderCasts();
      }
    }

    /* --- 2. 料金・コース描画 --- */
    function renderCourses() {
      const tbody = document.getElementById('courseTableBody');
      tbody.innerHTML = '';

      scheduleData.courses.forEach((course, idx) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition-all';
        tr.innerHTML = `
          <td class="p-4"><input type="text" value="${course.name}" onchange="scheduleData.courses[${idx}].name = this.value" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg border border-slate-800 w-48"></td>
          <td class="p-4"><input type="number" value="${course.minutes}" onchange="scheduleData.courses[${idx}].minutes = Number(this.value)" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg border border-slate-800 w-24"></td>
          <td class="p-4"><input type="number" value="${course.price}" onchange="scheduleData.courses[${idx}].price = Number(this.value)" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg border border-slate-800 w-32"></td>
          <td class="p-4 text-right"><button onclick="deleteCourse(${idx})" class="text-xs text-rose-400 hover:text-rose-300 font-bold px-3 py-1 bg-rose-950/40 border border-rose-800 rounded-lg">削除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addNewCourse() {
      scheduleData.courses.push({
        id: 'c_' + Date.now(),
        name: '新コース',
        minutes: 60,
        price: 20000
      });
      renderCourses();
    }

    function deleteCourse(idx) {
      if (confirm('このコースを削除しますか？')) {
        scheduleData.courses.splice(idx, 1);
        renderCourses();
      }
    }

    /* --- 3. 出勤・〇×コマ描画 --- */
    function renderSchedules() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      const targetDate = document.getElementById('datePicker').value;
      if (!scheduleData.schedules[targetDate]) {
        scheduleData.schedules[targetDate] = {};
      }

      const daySchedules = scheduleData.schedules[targetDate];

      scheduleData.casts.forEach(cast => {
        if (!daySchedules[cast.id]) daySchedules[cast.id] = {};
        const slots = daySchedules[cast.id];

        const card = document.createElement('div');
        card.className = 'bg-slate-900 rounded-2xl p-6 border border-slate-800 space-y-4';

        let slotsHtml = '<div class="grid grid-cols-6 sm:grid-cols-12 gap-2 mt-2">';
        const timeKeys = Object.keys(slots).sort();

        if (timeKeys.length === 0) {
          slotsHtml += '<p class="col-span-full text-xs text-slate-500 italic">※出勤時間が設定されていません</p>';
        } else {
          timeKeys.forEach(time => {
            const status = slots[time];
            const isOK = status === 'ok';

            slotsHtml += `
              <button
                onclick="toggleSlot('${cast.id}', '${time}')"
                class="p-2 rounded-xl border flex flex-col items-center justify-center font-bold transition-all ${
                  isOK
                    ? 'bg-emerald-950/40 border-emerald-800 text-emerald-400 hover:bg-emerald-900/50'
                    : 'bg-rose-950/40 border-rose-800 text-rose-400 hover:bg-rose-900/50'
                }"
              >
                <span class="text-[10px] text-slate-400 font-mono">${time}</span>
                <span class="text-sm">${isOK ? '〇' : '×'}</span>
              </button>
            `;
          });
        }
        slotsHtml += '</div>';

        card.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-slate-800">
            <div class="flex items-center gap-3">
              <img src="${cast.photo}" class="w-8 h-8 object-cover rounded-lg bg-slate-800">
              <h3 class="font-bold text-white">${cast.name}</h3>
            </div>
            <div class="flex items-center gap-2 text-xs bg-slate-950 p-2 rounded-xl border border-slate-800">
              <span class="text-slate-400 font-bold">出勤範囲:</span>
              <input type="time" id="start_${cast.id}" value="12:00" class="bg-slate-900 border border-slate-700 text-white rounded p-1">
              <span>〜</span>
              <input type="time" id="end_${cast.id}" value="20:00" class="bg-slate-900 border border-slate-700 text-white rounded p-1">
              <button onclick="generateShift('${cast.id}')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-xs font-bold border border-slate-700">コマ一括生成</button>
            </div>
          </div>
          ${slotsHtml}
        `;
        container.appendChild(card);
      });
    }

    function generateShift(castId) {
      const targetDate = document.getElementById('datePicker').value;
      const start = document.getElementById(`start_${castId}`).value;
      const end = document.getElementById(`end_${castId}`).value;

      if (!start || !end) return;

      let current = new Date(`2026-01-01T${start}:00`);
      const endDate = new Date(`2026-01-01T${end}:00`);

      const newSlots = {};
      while (current < endDate) {
        const timeStr = current.toTimeString().substring(0, 5);
        newSlots[timeStr] = "ok";
        current.setMinutes(current.getMinutes() + 30);
      }

      scheduleData.schedules[targetDate][castId] = newSlots;
      renderSchedules();
    }

    function toggleSlot(castId, time) {
      const targetDate = document.getElementById('datePicker').value;
      const currentStatus = scheduleData.schedules[targetDate][castId][time];
      scheduleData.schedules[targetDate][castId][time] = currentStatus === 'ok' ? 'ng' : 'ok';
      renderSchedules();
    }

    /* --- GitHubへの一括保存 (各ボタン共通) --- */
    async function saveData(targetCategoryName) {
      const token = getToken();
      if (!token) return;

      try {
        const jsonString = JSON.stringify(scheduleData, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Update ${targetCategoryName} from admin dashboard`,
            content: base64Content,
            sha: fileSha
          })
        });

        if (res.ok) {
          const resData = await res.json();
          fileSha = resData.content.sha;
          alert('更新が完了しました！');
        } else {
          alert('保存に失敗しました。');
        }
      } catch (err) {
        alert('通信エラーが発生しました。');
      }
    }

    loadData();
  </script>
</body>
</html>
