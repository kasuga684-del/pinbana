<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗統合管理ページ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8">

  <main class="max-w-3xl mx-auto space-y-8">
    
    <!-- ヘッダー -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <span class="text-xs text-pink-500 font-bold uppercase tracking-wider">Store Admin</span>
        <h1 class="text-xl font-bold">店舗設定 ＆ 予約枠コントロール</h1>
      </div>
      <button onclick="saveTokenPrompt()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700">
        🔑 トークン設定
      </button>
    </div>

    <!-- 1. 日付選択 -->
    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row gap-4 justify-between items-center">
      <div class="w-full sm:w-auto">
        <label class="text-xs text-slate-400 block mb-1">📅 管理対象の日付</label>
        <input type="date" id="datePicker" onchange="loadSchedule()" class="bg-slate-950 text-white font-bold px-3 py-2 rounded-lg border border-slate-800 w-full">
      </div>
      <button onclick="loadSchedule()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2.5 rounded-lg border border-slate-700">
        🔄 データを再読み込み
      </button>
    </div>

    <!-- 2. キャスト管理・出勤枠管理 -->
    <section class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-bold text-pink-400 border-l-4 border-pink-500 pl-2">キャスト ＆ 出勤〇×設定</h2>
        <button onclick="addNewCast()" class="text-xs bg-pink-600 hover:bg-pink-500 text-white font-bold px-3 py-2 rounded-lg">
          ＋ 新規キャスト追加
        </button>
      </div>

      <div id="adminCastContainer" class="space-y-6">
        <p class="text-xs text-slate-500 italic">データを読み込み中...</p>
      </div>
    </section>

    <!-- 3. 一括保存ボタン -->
    <div class="sticky bottom-4 bg-slate-950/90 p-4 rounded-2xl border border-slate-800 backdrop-blur-md flex justify-between items-center z-30">
      <span class="text-xs text-slate-400">変更後は必ず保存してください</span>
      <button id="saveBtn" onclick="saveToGitHub()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition-all">
        💾 GitHubへ保存（更新）
      </button>
    </div>

  </main>

  <script>
    const OWNER = 'kasuga684-del';
    const REPO = 'pinbana';
    const FILE_PATH = 'schedule.json';

    let scheduleData = null;
    let fileSha = '';

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('datePicker').value = todayStr;

    function getToken() {
      let token = localStorage.getItem('github_pat');
      if (!token) {
        token = prompt('GitHub トークン（ghp_...）を入力してください:');
        if (token) localStorage.setItem('github_pat', token.trim());
      }
      return token;
    }

    function saveTokenPrompt() {
      const token = prompt('新しい GitHub トークン（ghp_...）を入力してください:');
      if (token) {
        localStorage.setItem('github_pat', token.trim());
        alert('トークンを保存しました！');
        loadSchedule();
      }
    }

    async function loadSchedule() {
      const token = getToken();
      if (!token) return;

      const container = document.getElementById('adminCastContainer');
      container.innerHTML = '<p class="text-xs text-slate-500 italic">読み込み中...</p>';

      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `token ${token}` },
          cache: 'no-store'
        });

        if (!res.ok) throw new Error('取得失敗');

        const json = await res.json();
        fileSha = json.sha;

        const content = decodeURIComponent(escape(atob(json.content)));
        scheduleData = JSON.parse(content);

        renderAdminList();
      } catch (err) {
        container.innerHTML = '<p class="text-xs text-red-400">データの取得に失敗しました。トークンを確認してください。</p>';
      }
    }

    function renderAdminList() {
      if (!scheduleData) return;
      const targetDate = document.getElementById('datePicker').value;
      const container = document.getElementById('adminCastContainer');
      container.innerHTML = '';

      if (!scheduleData.schedules[targetDate]) {
        scheduleData.schedules[targetDate] = {};
      }

      const daySchedules = scheduleData.schedules[targetDate];

      scheduleData.casts.forEach((cast, idx) => {
        if (!daySchedules[cast.id]) {
          daySchedules[cast.id] = {};
        }

        const slots = daySchedules[cast.id];
        const card = document.createElement('div');
        card.className = 'bg-slate-900 rounded-2xl p-5 border border-slate-800 space-y-4';

        // キャスト情報編集フォーム
        let infoHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-4 border-b border-slate-800">
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">名前</label>
              <input type="text" value="${cast.name}" onchange="updateCastInfo(${idx}, 'name', this.value)" class="bg-slate-950 text-xs text-white p-2 rounded border border-slate-800 w-full">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">年齢</label>
              <input type="number" value="${cast.age}" onchange="updateCastInfo(${idx}, 'age', Number(this.value))" class="bg-slate-950 text-xs text-white p-2 rounded border border-slate-800 w-full">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">タグ/キャッチコピー</label>
              <input type="text" value="${cast.tag}" onchange="updateCastInfo(${idx}, 'tag', this.value)" class="bg-slate-950 text-xs text-white p-2 rounded border border-slate-800 w-full">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">本指名料 (円)</label>
              <input type="number" value="${cast.nominationFee}" onchange="updateCastInfo(${idx}, 'nominationFee', Number(this.value))" class="bg-slate-950 text-xs text-white p-2 rounded border border-slate-800 w-full">
            </div>
            <div class="sm:col-span-2">
              <label class="text-[10px] text-slate-400 block mb-1">写真画像URL</label>
              <input type="text" value="${cast.photo}" onchange="updateCastInfo(${idx}, 'photo', this.value)" class="bg-slate-950 text-xs text-white p-2 rounded border border-slate-800 w-full">
            </div>
          </div>
        `;

        // 出勤時間の自動セット
        let shiftGenHtml = `
          <div class="flex items-center gap-2 text-xs bg-slate-950 p-3 rounded-xl border border-slate-800">
            <span class="text-slate-400 font-bold">出勤時間自動生成:</span>
            <input type="time" id="start_${cast.id}" value="12:00" class="bg-slate-900 border border-slate-700 text-white rounded p-1">
            <span>〜</span>
            <input type="time" id="end_${cast.id}" value="20:00" class="bg-slate-900 border border-slate-700 text-white rounded p-1">
            <button onclick="generateShift('${cast.id}')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-xs font-bold border border-slate-700">枠反映</button>
          </div>
        `;

        // 30分枠コマ一覧
        let slotsHtml = '<div class="grid grid-cols-3 sm:grid-cols-6 gap-2">';
        const timeKeys = Object.keys(slots).sort();
        
        if (timeKeys.length === 0) {
          slotsHtml += '<p class="col-span-full text-xs text-slate-500 italic">※出勤枠が設定されていません</p>';
        } else {
          timeKeys.forEach(time => {
            const status = slots[time];
            const isOK = status === 'ok';

            slotsHtml += `
              <button
                onclick="toggleSlot('${cast.id}', '${time}')"
                class="p-2 rounded-xl border flex flex-col items-center justify-center font-bold transition-all ${
                  isOK
                    ? 'bg-emerald-950/40 border-emerald-800 text-emerald-400'
                    : 'bg-rose-950/40 border-rose-800 text-rose-400'
                }"
              >
                <span class="text-[10px] text-slate-400 font-mono">${time}</span>
                <span class="text-sm">${isOK ? '〇' : '×'}</span>
              </button>
            `;
          });
        }
        slotsHtml += '</div>';

        card.innerHTML = infoHtml + shiftGenHtml + slotsHtml;
        container.appendChild(card);
      });
    }

    function updateCastInfo(index, field, value) {
      scheduleData.casts[index][field] = value;
    }

    function addNewCast() {
      const newId = 'cast_' + String(scheduleData.casts.length + 1).padStart(2, '0');
      scheduleData.casts.push({
        id: newId,
        name: '新規キャスト',
        age: 20,
        tag: '新人',
        photo: 'https://via.placeholder.com/150',
        nominationFee: 3000
      });
      renderAdminList();
    }

    function generateShift(castId) {
      const targetDate = document.getElementById('datePicker').value;
      const start = document.getElementById(`start_${castId}`).value;
      const end = document.getElementById(`end_${castId}`).value;

      if (!start || !end) return;

      let current = new Date(`2026-01-01T${start}:00`);
      const endDate = new Date(`2026-01-01T${end}:00`);

      const newSlots = {};
      while (current < endDate) {
        const timeStr = current.toTimeString().substring(0, 5);
        newSlots[timeStr] = "ok";
        current.setMinutes(current.getMinutes() + 30);
      }

      scheduleData.schedules[targetDate][castId] = newSlots;
      renderAdminList();
    }

    function toggleSlot(castId, time) {
      const targetDate = document.getElementById('datePicker').value;
      const currentStatus = scheduleData.schedules[targetDate][castId][time];
      scheduleData.schedules[targetDate][castId][time] = currentStatus === 'ok' ? 'ng' : 'ok';
      renderAdminList();
    }

    async function saveToGitHub() {
      const token = getToken();
      if (!token) return;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = '保存中...';

      try {
        const jsonString = JSON.stringify(scheduleData, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update cast and schedule info',
            content: base64Content,
            sha: fileSha
          })
        });

        if (res.ok) {
          const resData = await res.json();
          fileSha = resData.content.sha;
          alert('設定を保存しました！');
        } else {
          alert('保存に失敗しました。');
        }
      } catch (err) {
        alert('通信エラーが発生しました。');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = '💾 GitHubへ保存（更新）';
      }
    }

    loadSchedule();
  </script>
</body>
</html>
