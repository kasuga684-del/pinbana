<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗管理画面 - シフト・キャスト管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow flex justify-between items-center max-w-4xl mx-auto">
    <h1 class="text-base font-bold flex items-center gap-2">⚙ 店舗管理ダッシュボード</h1>
    <button onclick="saveToGitHub()" id="saveBtn" class="bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold px-4 py-2 rounded-xl shadow transition-all">
      💾 変更を保存して公開
    </button>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- GitHub Token 設定 -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-slate-600">🔑 GitHub Personal Access Token</label>
        <span id="tokenStatus" class="text-[10px] text-slate-400">未設定</span>
      </div>
      <input type="password" id="ghToken" oninput="saveToken()" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-pink-500 font-mono">
      <p class="text-[10px] text-slate-400">※GitHubの「repo」権限を持つトークンを入力してください。</p>
    </div>

    <!-- タブ切り替え -->
    <div class="flex justify-start border-b border-slate-200 bg-white rounded-t-2xl px-4 pt-2 gap-2 text-xs font-bold">
      <button onclick="switchTab('schedule')" id="tabSchedule" class="px-4 py-2.5 text-pink-600 border-b-2 border-pink-500">📅 出勤・空き枠管理</button>
      <button onclick="switchTab('casts')" id="tabCasts" class="px-4 py-2.5 text-slate-400 border-b-2 border-transparent">👤 キャスト登録・編集</button>
      <button onclick="switchTab('courses')" id="tabCourses" class="px-4 py-2.5 text-slate-400 border-b-2 border-transparent">⏱ コース・オプション設定</button>
    </div>

    <!-- TAB 1: シフト管理 -->
    <section id="secSchedule" class="bg-white p-4 rounded-b-2xl border-x border-b border-slate-200 shadow-sm space-y-4">
      <div class="flex gap-2 items-center">
        <label class="text-xs font-bold text-slate-500">日付を選択:</label>
        <input type="date" id="scheduleDateInput" onchange="renderScheduleEditor()" class="bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold outline-none focus:border-pink-500">
      </div>
      <div id="scheduleGrid" class="space-y-4"></div>
    </section>

    <!-- TAB 2: キャスト管理 -->
    <section id="secCasts" class="bg-white p-4 rounded-b-2xl border-x border-b border-slate-200 shadow-sm space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-slate-500">登録キャスト一覧</h2>
        <button onclick="addNewCast()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ 新規キャスト追加</button>
      </div>
      <div id="castList" class="space-y-4"></div>
    </section>

    <!-- TAB 3: コース・オプション管理 -->
    <section id="secCourses" class="bg-white p-4 rounded-b-2xl border-x border-b border-slate-200 shadow-sm space-y-6 hidden">
      <!-- コース一覧 -->
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-slate-700">⏱ コース設定</h2>
          <button onclick="addNewCourse()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ 新規コース追加</button>
        </div>
        <div id="courseList" class="space-y-3"></div>
      </div>

      <hr class="border-slate-200 my-6">

      <!-- オプション一覧 -->
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-xs font-bold text-slate-700">🛠 オプション設定</h2>
            <p class="text-[10px] text-slate-400">お客様が予約時に任意で追加選択できる項目です</p>
          </div>
          <button onclick="addNewOption()" class="bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl">+ 新規オプション追加</button>
        </div>
        <div id="optionList" class="space-y-3"></div>
      </div>
    </section>

  </main>

  <script>
    const GITHUB_OWNER = 'kasuga684-del';
    const GITHUB_REPO = 'pinbana';
    const FILE_PATH = 'schedule.json';
    const BRANCH = 'main';

    const TIME_LIST = [
      '10:00','10:30','11:00','11:30',
      '12:00','12:30','13:00','13:30',
      '14:00','14:30','15:00','15:30',
      '16:00','16:30','17:00','17:30',
      '18:00','18:30','19:00','19:30',
      '20:00','20:30','21:00','21:30',
      '22:00','22:30','23:00'
    ];

    let rawData = null;
    let fileSha = '';

    const todayStr = new Date().toISOString().split('T')[0];

    function getApiUrl() {
      return `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    function base64ToUtf8(base64) {
      const binary = atob(base64.replace(/\s/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    window.onload = () => {
      document.getElementById('scheduleDateInput').value = todayStr;
      const savedToken = localStorage.getItem('pb_admin_token');
      if (savedToken) {
        document.getElementById('ghToken').value = savedToken;
        document.getElementById('tokenStatus').innerText = '✅ 設定済み';
        document.getElementById('tokenStatus').className = 'text-[10px] text-green-600 font-bold';
      }
      fetchData();
    };

    function saveToken() {
      const t = document.getElementById('ghToken').value.trim();
      localStorage.setItem('pb_admin_token', t);
      document.getElementById('tokenStatus').innerText = t ? '✅ 設定済み' : '未設定';
      document.getElementById('tokenStatus').className = t ? 'text-[10px] text-green-600 font-bold' : 'text-[10px] text-slate-400';
    }

    function switchTab(tab) {
      ['schedule', 'casts', 'courses'].forEach(t => {
        document.getElementById(`sec${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.add('hidden');
        document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).className = 'px-4 py-2.5 text-slate-400 border-b-2 border-transparent';
      });
      document.getElementById(`sec${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('hidden');
      document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).className = 'px-4 py-2.5 text-pink-600 border-b-2 border-pink-500';
    }

    async function fetchData() {
      const token = localStorage.getItem('pb_admin_token');
      const headers = token ? { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } : { 'Accept': 'application/vnd.github.v3+json' };

      try {
        const res = await fetch(`${getApiUrl()}?ref=${BRANCH}&t=${Date.now()}`, { headers });
        if (res.ok) {
          const json = await res.json();
          fileSha = json.sha;
          rawData = JSON.parse(base64ToUtf8(json.content));
          if (!rawData.options) rawData.options = [];
          renderScheduleEditor();
          renderCastEditor();
          renderCourseEditor();
          renderOptionEditor();
          return;
        }
      } catch (err) {}

      try {
        const res = await fetch(`./schedule.json?t=${Date.now()}`);
        rawData = await res.json();
        if (!rawData.options) rawData.options = [];
        renderScheduleEditor();
        renderCastEditor();
        renderCourseEditor();
        renderOptionEditor();
      } catch (e) {
        alert('schedule.json の読み込みに失敗しました');
      }
    }

    // --- TAB 1: シフト管理 ---
    function renderScheduleEditor() {
      if (!rawData) return;
      const date = document.getElementById('scheduleDateInput').value;
      const container = document.getElementById('scheduleGrid');
      container.innerHTML = '';

      if (!rawData.schedules) rawData.schedules = {};
      if (!rawData.schedules[date]) rawData.schedules[date] = {};

      rawData.casts.forEach(cast => {
        const currentSlots = rawData.schedules[date][cast.id] || {};
        const card = document.createElement('div');
        card.className = 'border border-slate-200 rounded-2xl p-4 space-y-3 bg-slate-50';

        let slotBtns = '';
        TIME_LIST.forEach(t => {
          const status = currentSlots[t];
          let color = 'bg-white border-slate-200 text-slate-400';
          let label = '-';
          if (status === 'ok') { color = 'bg-green-500 text-white border-green-600 font-bold'; label = '〇'; }
          if (status === 'ng') { color = 'bg-red-500 text-white border-red-600 font-bold'; label = '×'; }

          slotBtns += `
            <button onclick="toggleSlot('${date}', '${cast.id}', '${t}')" class="px-1.5 py-1.5 rounded-lg border text-[11px] flex flex-col items-center justify-center transition-all ${color}">
              <span class="font-medium">${t}</span>
              <span class="text-xs font-bold">${label}</span>
            </button>
          `;
        });

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <img src="${cast.photo}" class="w-8 h-8 rounded-lg object-cover bg-slate-200" />
              <span class="font-bold text-sm text-slate-800">${cast.name}</span>
            </div>
            <div class="flex gap-1.5 text-xs">
              <button onclick="setAllSlots('${date}', '${cast.id}', 'ok')" class="px-2.5 py-1 bg-green-50 border border-green-300 text-green-700 rounded-lg font-bold hover:bg-green-100">全〇</button>
              <button onclick="setAllSlots('${date}', '${cast.id}', 'ng')" class="px-2.5 py-1 bg-red-50 border border-red-300 text-red-700 rounded-lg font-bold hover:bg-red-100">全×</button>
              <button onclick="clearAllSlots('${date}', '${cast.id}')" class="px-2.5 py-1 bg-slate-200 border border-slate-300 text-slate-600 rounded-lg font-bold hover:bg-slate-300">お休み (クリア)</button>
            </div>
          </div>
          <div class="grid grid-cols-5 sm:grid-cols-7 md:grid-cols-9 gap-1.5">
            ${slotBtns}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleSlot(date, castId, time) {
      if (!rawData.schedules[date][castId]) rawData.schedules[date][castId] = {};
      const cur = rawData.schedules[date][castId][time];
      if (!cur) rawData.schedules[date][castId][time] = 'ok';
      else if (cur === 'ok') rawData.schedules[date][castId][time] = 'ng';
      else delete rawData.schedules[date][castId][time];
      renderScheduleEditor();
    }

    function setAllSlots(date, castId, status) {
      if (!rawData.schedules[date][castId]) rawData.schedules[date][castId] = {};
      TIME_LIST.forEach(t => { rawData.schedules[date][castId][t] = status; });
      renderScheduleEditor();
    }

    function clearAllSlots(date, castId) {
      delete rawData.schedules[date][castId];
      renderScheduleEditor();
    }

    // --- TAB 2: キャスト管理 ---
    function renderCastEditor() {
      if (!rawData || !rawData.casts) return;
      const container = document.getElementById('castList');
      container.innerHTML = '';

      rawData.casts.forEach((cast, idx) => {
        const div = document.createElement('div');
        div.className = 'border border-slate-200 rounded-2xl p-4 space-y-3 bg-slate-50';
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm text-slate-700">#${idx + 1} ${cast.name}</span>
            <button onclick="deleteCast(${idx})" class="text-red-500 text-xs font-bold hover:underline">削除</button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
            <div><label class="text-slate-400 block mb-0.5">名前</label><input type="text" value="${cast.name}" oninput="rawData.casts[${idx}].name = this.value" class="w-full p-2 border rounded-lg"></div>
            <div><label class="text-slate-400 block mb-0.5">年齢</label><input type="text" value="${cast.age}" oninput="rawData.casts[${idx}].age = this.value" class="w-full p-2 border rounded-lg"></div>
            <div><label class="text-slate-400 block mb-0.5">身長</label><input type="text" value="${cast.height}" oninput="rawData.casts[${idx}].height = this.value" class="w-full p-2 border rounded-lg"></div>
            <div><label class="text-slate-400 block mb-0.5">カップ</label><input type="text" value="${cast.cup}" oninput="rawData.casts[${idx}].cup = this.value" class="w-full p-2 border rounded-lg"></div>
            <div><label class="text-slate-400 block mb-0.5">バスト</label><input type="text" value="${cast.bust}" oninput="rawData.casts[${idx}].bust = this.value" class="w-full p-2 border rounded-lg"></div>
            <div><label class="text-slate-400 block mb-0.5">ウエスト</label><input type="text" value="${cast.waist}" oninput="rawData.casts[${idx}].waist = this.value" class="w-full p-2 border rounded-lg"></div>
            <div><label class="text-slate-400 block mb-0.5">ヒップ</label><input type="text" value="${cast.hip}" oninput="rawData.casts[${idx}].hip = this.value" class="w-full p-2 border rounded-lg"></div>
            <div class="flex items-center gap-2 pt-4">
              <input type="checkbox" ${cast.isRookie ? 'checked' : ''} onchange="rawData.casts[${idx}].isRookie = this.checked" id="rookie_${idx}">
              <label for="rookie_${idx}" class="font-bold text-pink-600">新人フラグ</label>
            </div>
          </div>
          <div>
            <label class="text-slate-400 block text-xs mb-0.5">写真URL</label>
            <input type="text" value="${cast.photo}" oninput="rawData.casts[${idx}].photo = this.value" class="w-full p-2 border rounded-lg text-xs">
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addNewCast() {
      const newId = 'c' + Date.now();
      if (!rawData.casts) rawData.casts = [];
      rawData.casts.push({
        id: newId,
        name: '新規キャスト',
        age: 20,
        height: 160,
        bust: 85,
        cup: 'D',
        waist: 58,
        hip: 86,
        photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60',
        isRookie: false
      });
      renderCastEditor();
    }

    function deleteCast(idx) {
      if (confirm('本当に削除しますか？')) {
        rawData.casts.splice(idx, 1);
        renderCastEditor();
      }
    }

    // --- TAB 3: コース管理 ---
    function renderCourseEditor() {
      if (!rawData || !rawData.courses) return;
      const container = document.getElementById('courseList');
      container.innerHTML = '';

      rawData.courses.forEach((c, idx) => {
        const div = document.createElement('div');
        div.className = 'border border-slate-200 rounded-2xl p-4 bg-slate-50 space-y-3';
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-xs text-slate-700">コース #${idx + 1} (${c.minutes}分)</span>
            <button onclick="deleteCourse(${idx})" class="text-red-500 text-xs font-bold hover:underline">削除</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
            <div>
              <label class="text-slate-400 block text-[10px]">時間 (分)</label>
              <input type="number" value="${c.minutes}" oninput="updateCourseMinutes(${idx}, this.value)" class="w-full p-2 border rounded-lg font-bold">
            </div>
            <div>
              <label class="text-slate-400 block text-[10px]">通常料金 (¥)</label>
              <input type="number" value="${c.priceNormal}" oninput="rawData.courses[${idx}].priceNormal = Number(this.value)" class="w-full p-2 border rounded-lg font-bold">
            </div>
            <div>
              <label class="text-slate-400 block text-[10px]">新人料金 (¥)</label>
              <input type="number" value="${c.priceRookie}" oninput="rawData.courses[${idx}].priceRookie = Number(this.value)" class="w-full p-2 border rounded-lg font-bold text-pink-600">
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateCourseMinutes(idx, val) {
      const min = Number(val);
      rawData.courses[idx].minutes = min;
      rawData.courses[idx].name = `${min}分コース`;
    }

    function addNewCourse() {
      const newId = 'crs_' + Date.now();
      if (!rawData.courses) rawData.courses = [];
      rawData.courses.push({
        id: newId,
        name: '60分コース',
        minutes: 60,
        priceNormal: 15000,
        priceRookie: 13000
      });
      renderCourseEditor();
    }

    function deleteCourse(idx) {
      if (confirm('このコースを削除しますか？')) {
        rawData.courses.splice(idx, 1);
        renderCourseEditor();
      }
    }

    // --- TAB 3: オプション管理 ---
    function renderOptionEditor() {
      if (!rawData) return;
      if (!rawData.options) rawData.options = [];
      const container = document.getElementById('optionList');
      container.innerHTML = '';

      if (rawData.options.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 italic bg-slate-50 p-3 rounded-xl border border-slate-200">※登録されているオプションはありません</p>';
        return;
      }

      rawData.options.forEach((opt, idx) => {
        const div = document.createElement('div');
        div.className = 'border border-slate-200 rounded-2xl p-4 bg-slate-50 space-y-3';
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-xs text-slate-700">オプション #${idx + 1}</span>
            <button onclick="deleteOption(${idx})" class="text-red-500 text-xs font-bold hover:underline">削除</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
            <div>
              <label class="text-slate-400 block text-[10px]">オプション名 (例: コスプレ / ローションなど)</label>
              <input type="text" value="${opt.name}" oninput="rawData.options[${idx}].name = this.value" placeholder="オプション名" class="w-full p-2 border rounded-lg font-bold">
            </div>
            <div>
              <label class="text-slate-400 block text-[10px]">追加料金 (¥)</label>
              <input type="number" value="${opt.price}" oninput="rawData.options[${idx}].price = Number(this.value)" placeholder="料金" class="w-full p-2 border rounded-lg font-bold text-pink-600">
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addNewOption() {
      const newId = 'opt_' + Date.now();
      if (!rawData.options) rawData.options = [];
      rawData.options.push({
        id: newId,
        name: '新規オプション',
        price: 2000
      });
      renderOptionEditor();
    }

    function deleteOption(idx) {
      if (confirm('このオプションを削除しますか？')) {
        rawData.options.splice(idx, 1);
        renderOptionEditor();
      }
    }

    // --- 保存 ＆ GitHub Commit ---
    async function saveToGitHub() {
      const token = localStorage.getItem('pb_admin_token');
      if (!token) {
        alert('GitHub Token が設定されていません。上部の入力欄に入力してください。');
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerText = '保存中...';

      try {
        const checkRes = await fetch(`${getApiUrl()}?ref=${BRANCH}&t=${Date.now()}`, {
          headers: { 
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (!checkRes.ok) {
          if (checkRes.status === 401 || checkRes.status === 403) {
            throw new Error('トークンが無効または期限切れです。');
          }
          throw new Error('ファイル情報の取得に失敗しました');
        }

        const checkJson = await checkRes.json();
        fileSha = checkJson.sha;

        const jsonString = JSON.stringify(rawData, null, 2);
        const base64Content = utf8ToBase64(jsonString);

        const body = {
          message: 'コース・オプション・シフト設定を更新',
          content: base64Content,
          sha: fileSha,
          branch: BRANCH
        };

        const res = await fetch(getApiUrl(), {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const errJson = await res.json();
          throw new Error(errJson.message || '保存に失敗しました');
        }

        const resJson = await res.json();
        fileSha = resJson.content.sha;
        alert('✅ 変更をGitHubへ保存しました！');
      } catch (err) {
        alert('❌ 保存エラー: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 変更を保存して公開';
      }
    }
  </script>
</body>
</html>
